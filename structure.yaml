src:
  structure.yaml:
    content: |-
      映画表現スタイルダッシュボード (Next.js, shadcn/ui, Vercel)
      - 「映画表現 - スタイル」グリモワールの内容を紹介するダッシュボード
      - 写実系/非写実系の階層構造でスタイルを分類・表示
      - 各スタイルはカード形式で表示し、画像と説明を含む
      - 画像は東京の夜景を各スタイルで表現したものを使用
      - ユーザーは階層を選択してスタイルを探索できる
      - Next.js (App Router), shadcn/ui を使用し、Vercelにデプロイ
      agent選定理由: claude-3-5-sonnet-20241022は、Next.jsのプロジェクト構成、
      Reactコンポーネントの作成、shadcn/uiの利用、JSONデータの扱い、
      およびVercelデプロイ設定に優れているため。
      ref: "映画表現 - スタイル - kzkk.rgb: ダッシュボードに表示するスタイル情報とその分類の参照元"
    dependency:
      - app/page.tsx
      - app/layout.tsx
      - components/ui/card.tsx
      - components/style-grid.tsx
      - lib/styles.ts
      - public/images/tokyo_night_*.png
      - package.json
      - tsconfig.json
      - postcss.config.js
      - tailwind.config.js
    agent: "claude-3-5-sonnet-20241022"
    api: []

  app:
    page.tsx:
      content: |-
        import StyleGrid from '@/components/style-grid';
        import { stylesData } from '@/lib/styles';

        export default function Home() {
          return (
            <main className="container mx-auto p-4">
              <h1 className="text-4xl font-bold mb-8">映画表現スタイル</h1>
              <StyleGrid styles={stylesData} />
            </main>
          );
        }
      dependency:
        - ../components/style-grid.tsx
        - ../lib/styles.ts
      agent: "claude-3-5-sonnet-20241022"
      api: []

    layout.tsx:
      content: |-
        import type { Metadata } from 'next';
        import { Inter } from 'next/font/google';
        import './globals.css';

        const inter = Inter({ subsets: ['latin'] });

        export const metadata: Metadata = {
          title: '映画表現スタイル ダッシュボード',
          description: '映画表現のスタイルを一覧表示するダッシュボード',
        };

        export default function RootLayout({
          children,
        }: {
          children: React.ReactNode;
        }) {
          return (
            <html lang="ja">
              <body className={inter.className}>{children}</body>
            </html>
          );
        }
      dependency: []
      agent: "claude-3-5-sonnet-20241022"
      api: []
    
    globals.css:
      content: "@tailwind base;\n@tailwind components;\n@tailwind utilities;\n"
      dependency: []
      agent: "claude-3-5-sonnet-20241022"
      api: []

  components:
    ui:
      card.tsx:
        content: |-
          import { cn } from "@/lib/utils"

          export function Card({
            className,
            children,
          }: {
            className?: string
            children: React.ReactNode
          }) {
            return (
              <div
                className={cn(
                  "rounded-lg border bg-card text-card-foreground shadow-sm",
                  className
                )}
              >
                {children}
              </div>
            )
          }

          export function CardHeader({
            className,
            children,
          }: {
            className?: string
            children: React.ReactNode
          }) {
            return (
              <div className={cn("flex flex-col space-y-1.5 p-6", className)}>
                {children}
              </div>
            )
          }

          export function CardTitle({
            className,
            children,
          }: {
            className?: string
            children: React.ReactNode
          }) {
            return (
              <h3
                className={cn(
                  "text-2xl font-semibold leading-none tracking-tight",
                  className
                )}
              >
                {children}
              </h3>
            )
          }

          export function CardDescription({
            className,
            children,
          }: {
            className?: string
            children: React.ReactNode
          }) {
            return (
              <p
                className={cn("text-sm text-muted-foreground", className)}
              >
                {children}
              </p>
            )
          }
          export function CardContent({
            className,
            children,
          }: {
            className?: string
            children: React.ReactNode
          }) {
            return <div className={cn("p-6 pt-0", className)}>{children}</div>
          }
        dependency:
          - ../../lib/utils.ts
        agent: "claude-3-5-sonnet-20241022"
        api: []

    style-grid.tsx:
      content: |-
        import Image from 'next/image';
        import { Card, CardContent, CardDescription, CardHeader, CardTitle } from './ui/card';

        interface Style {
          name: string;
          image: string;
          description: string;
        }

        interface StyleCategory {
          [category: string]: {
            [styleName: string]: Style;
          };
        }

        interface StyleGridProps {
          styles: StyleCategory;
        }

        export default function StyleGrid({ styles }: StyleGridProps) {
          return (
            <div>
              {Object.entries(styles).map(([category, stylesInCategory]) => (
                <div key={category} className="mb-8">
                  <h2 className="text-3xl font-bold mb-4">{category}</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {Object.entries(stylesInCategory).map(([styleName, style]) => (
                      <Card key={styleName}>
                        <CardHeader>
                          <CardTitle>{style.name}</CardTitle>
                          <CardDescription>{styleName}</CardDescription>
                        </CardHeader>
                        <CardContent>
                          <div className="relative aspect-w-16 aspect-h-9">
                            <Image
                              src={style.image}
                              alt={style.name}
                              fill
                              className="object-cover rounded-md"
                            />
                          </div>
                          <p className="text-sm mt-2">{style.description}</p>
                        </CardContent>
                      </Card>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          );
        }
      dependency:
        - ./ui/card.tsx
      agent: "claude-3-5-sonnet-20241022"
      api: []

